services:
  - type: web
    name: ridenload-platform
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SIMULATION_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
