<svg width="420" height="880" viewBox="0 0 420 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Phone Frame -->
  <rect x="10" y="10" width="400" height="860" rx="48" fill="#0B132B" stroke="#1E293B" stroke-width="8"/>
  <rect x="18" y="18" width="384" height="844" rx="42" fill="#0F172A"/>

  <!-- Dynamic Island Notch -->
  <rect x="140" y="28" width="140" height="28" rx="14" fill="#000000"/>
  <circle cx="255" cy="42" r="5" fill="#1E293B"/>

  <!-- Status Bar -->
  <text x="45" y="46" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">9:41</text>
  <path d="M360 38h18v10h-18z" fill="#F8FAFC" rx="2"/>
  <path d="M379 41h2v4h-2z" fill="#F8FAFC"/>

  <!-- Driver Header with Duty Switch -->
  <g transform="translate(30, 75)">
    <!-- Driver Info -->
    <rect x="0" y="0" width="360" height="60" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <!-- Status Dot -->
    <circle cx="24" cy="30" r="7" fill="#10B981"/>
    
    <text x="42" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Murugan Selvam</text>
    <text x="42" y="44" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ON DUTY • GPS LIVE</text>

    <!-- Duty Toggle Button -->
    <rect x="250" y="12" width="98" height="36" rx="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="264" y="34" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">GO OFFLINE</text>
  </g>

  <!-- Today's Earnings & Shift Summary -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="360" height="96" rx="20" fill="#2872A1" fill-opacity="0.15" stroke="#2872A1" stroke-width="1.5"/>
    
    <text x="20" y="28" fill="#CBDDE9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TODAY'S EARNINGS</text>
    <text x="20" y="60" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">₹2,480.00</text>
    <text x="20" y="80" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">▲ +18% vs Yesterday</text>

    <line x1="220" y1="16" x2="220" y2="80" stroke="#334155" stroke-width="1"/>

    <text x="236" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">TRIPS DONE</text>
    <text x="236" y="52" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">6 Rides</text>

    <text x="236" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">ONLINE</text>
    <text x="236" y="85" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">5h 20m</text>
  </g>

  <!-- Live Dispatch Request Modal (Highlighted Feature) -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="360" height="280" rx="22" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Dispatch Header & Countdown -->
    <rect x="16" y="16" width="160" height="26" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="26" y="33" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">⚡ NEW DISPATCH ORDER</text>
    
    <!-- Timer Ring -->
    <circle cx="320" cy="28" r="16" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <text x="312" y="33" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">14s</text>

    <!-- Trip Category & Net Payout -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="328" height="54" rx="14" fill="#0F172A"/>
      <text x="14" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">VEHICLE CLASS</text>
      <text x="14" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🚗 DropTaxi Sedan</text>

      <text x="230" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">DRIVER SHARE</text>
      <text x="230" y="44" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">₹236.80</text>
    </g>

    <!-- Route details -->
    <g transform="translate(16, 122)">
      <!-- Pickup -->
      <circle cx="8" cy="14" r="5" fill="#10B981"/>
      <text x="22" y="10" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">PICKUP (1.2 km away)</text>
      <text x="22" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Chennai Central Railway Station</text>

      <!-- Connecting line -->
      <line x1="8" y1="24" x2="8" y2="44" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2"/>

      <!-- Drop -->
      <circle cx="8" cy="54" r="5" fill="#EF4444"/>
      <text x="22" y="50" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">DESTINATION (16.4 km total)</text>
      <text x="22" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Tidel Park Tech Hub, OMR</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(16, 212)">
      <!-- Decline Button -->
      <rect x="0" y="0" width="110" height="50" rx="14" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
      <text x="32" y="30" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Decline</text>

      <!-- Accept Button -->
      <rect x="120" y="0" width="208" height="50" rx="14" fill="#10B981"/>
      <text x="160" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">ACCEPT TRIP →</text>
    </g>
  </g>

  <!-- Ride Navigation & OTP Verification Card -->
  <g transform="translate(30, 555)">
    <rect x="0" y="0" width="360" height="150" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <text x="18" y="26" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ACTIVE PASSENGER CONTACT</text>
    
    <text x="18" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Ananya Krishnan</text>
    <text x="18" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">+91 98410 44221 • Cash / UPI</text>

    <!-- OTP Input Box -->
    <rect x="18" y="80" width="324" height="52" rx="14" fill="#0F172A" stroke="#2872A1" stroke-width="1"/>
    <text x="32" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Start Ride OTP:</text>
    
    <!-- OTP Digits -->
    <rect x="130" y="90" width="30" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="140" y="112" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="700">7</text>

    <rect x="170" y="90" width="30" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="180" y="112" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="700">8</text>

    <rect x="210" y="90" width="30" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="220" y="112" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="700">2</text>

    <rect x="250" y="90" width="30" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="260" y="112" fill="#38BDF8" font-family="monospace" font-size="16" font-weight="700">4</text>
    
    <text x="294" y="110" fill="#10B981" font-size="16">✓</text>
  </g>

  <!-- Complete Trip Button -->
  <g transform="translate(30, 718)">
    <rect x="0" y="0" width="360" height="52" rx="16" fill="#2872A1"/>
    <text x="96" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Complete Trip &amp; Collect Fare</text>
  </g>

  <!-- Bottom Driver Nav -->
  <g transform="translate(30, 790)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="28" fill="#38BDF8" font-size="18">📍</text>
    <text x="32" y="44" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Duty</text>

    <text x="135" y="28" fill="#64748B" font-size="18">💰</text>
    <text x="123" y="44" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Earnings</text>

    <text x="225" y="28" fill="#64748B" font-size="18">⭐</text>
    <text x="219" y="44" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Ratings</text>

    <text x="315" y="28" fill="#64748B" font-size="18">👤</text>
    <text x="311" y="44" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Account</text>
  </g>
</svg>
